server {
    listen 80;
    listen [::]:80;
    server_name mdcarrent.duckdns.org;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mdcarrent.duckdns.org;
    root /var/www/html/public;

    index index.php index.html;

    charset utf-8;

    # SSL Certificate Configuration
    ssl_certificate /etc/letsencrypt/live/mdcarrent.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mdcarrent.duckdns.org/privkey.pem;

    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Allow larger file uploads for KTP/Selfie images
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 180s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
